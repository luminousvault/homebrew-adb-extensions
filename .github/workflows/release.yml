name: Release Build

# Run from the terminal:  gh workflow run release.yml --ref main
# The version comes from the VERSION file; pass -f version=x.y.z only to
# double-check it (the run fails if they differ).
on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (비우면 VERSION 파일 값, 예: 2.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release only from main
        if: github.ref_name != 'main'
        run: |
          echo "Error: run the release on main (the tap reads Formula/ak.rb from main), not '${{ github.ref_name }}'"
          exit 1

      - name: Validate version format
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION=${VERSION:-$(cat VERSION)}
          VERSION=${VERSION#v}
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format '$VERSION'. Expected format: x.y.z (e.g., 2.0.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify VERSION file matches input
        run: |
          FILE_VERSION=$(cat VERSION)
          INPUT_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$INPUT_VERSION" ]; then
            echo "Error: VERSION file ($FILE_VERSION) does not match input version ($INPUT_VERSION)"
            echo "Please update VERSION to $INPUT_VERSION before running this workflow"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi

      - name: Test and smoke test
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          go vet ./...
          go test ./...
          go build -ldflags "-X main.version=${VERSION}" -o "$RUNNER_TEMP/ak" ./cmd/ak
          "$RUNNER_TEMP/ak" --version | grep -qF "$VERSION" || { echo "Error: --version does not show $VERSION"; exit 1; }
          "$RUNNER_TEMP/ak" --help | grep -qF "install" || { echo "Error: --help does not list install"; exit 1; }

      - name: Extract CHANGELOG for version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -z "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            echo "Error: No CHANGELOG entry found for version $VERSION"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create source archive
        id: archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="$RUNNER_TEMP/adb-extensions-v${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="adb-extensions-v${VERSION}/" -o "$ARCHIVE" HEAD
          echo "path=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$ARCHIVE" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      # Binaries first: the formula needs the SHA-256 of each uploaded archive.
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ steps.archive.outputs.path }}

      - name: Update Homebrew Formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          .github/formula/render.sh "$VERSION" dist/checksums.txt > Formula/ak.rb
          cat Formula/ak.rb
          git add Formula/ak.rb
          if ! git diff --cached --quiet; then
            git commit -m "Release: update Homebrew Formula for v${VERSION}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Release Summary"
            echo "- **Version:** v${VERSION}"
            echo "- **Source SHA256:** ${{ steps.archive.outputs.sha256 }}"
            echo '```bash'
            echo "brew tap luminousvault/adb-extensions"
            echo "brew trust luminousvault/adb-extensions"
            echo "brew install ak"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
