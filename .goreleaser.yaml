# GoReleaser config: prebuilt binaries attached to the GitHub release.
# Homebrew users build from source via Formula/ak.rb (see .github/formula/ak.rb.tmpl).
version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: ak
    main: ./cmd/ak
    binary: ak
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.date={{ time "2006-01-02" }}

archives:
  - id: ak
    name_template: "ak_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - completions/_ak
      - LICENSE.md
      - README.md
      - README.ko.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # The release workflow passes notes from CHANGELOG.md (--release-notes) and the
  # source archive used by the Homebrew formula (SOURCE_ARCHIVE).
  mode: replace
  extra_files:
    - glob: "{{ .Env.SOURCE_ARCHIVE }}"
