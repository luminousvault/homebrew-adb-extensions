# GoReleaser config: prebuilt binaries attached to the GitHub release.
# Formula/ak.rb downloads these archives (rendered from .github/formula/ak.rb.tmpl
# with dist/checksums.txt by the release workflow).
version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: ak
    main: ./cmd/ak
    binary: ak
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.date={{ time "2006-01-02" }}

# macOS gets one universal binary (Apple Silicon + Intel in one file), so Mac
# users do not pick a chip.
universal_binaries:
  - id: ak
    name_template: ak # default is the project name (homebrew-adb-extensions)
    replace: true

archives:
  - id: ak
    # Names as users see their machine: macos (universal), windows_x64 /
    # windows_arm64 (Windows settings), linux_x86_64 / linux_arm64 (uname -m).
    name_template: >-
      ak_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else if eq .Arch "amd64" }}{{ .Os }}_{{ if eq .Os "windows" }}x64{{ else }}x86_64{{ end }}
      {{- else }}{{ .Os }}_{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - completions/_ak
      - LICENSE.md
      - README.md
      - README.ko.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  # The release workflow passes notes from CHANGELOG.md (--release-notes) and a
  # source archive for building from source (SOURCE_ARCHIVE).
  mode: replace
  extra_files:
    - glob: "{{ .Env.SOURCE_ARCHIVE }}"
